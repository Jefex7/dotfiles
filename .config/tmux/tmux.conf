# Enable mouse support
set -g mouse on

# Enable 24-bit true color
# set-option -sa terminal-overrides ",xterm*:Tc"

# Reduce delay on ESC sequences
set -sg escape-time 0

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-auto-save 'on'
# set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
# set -g @plugin 'wfxr/tmux-power'
# set -g @tmux_power_theme 'moon'

# Default theme styling (visible and clear)
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-bg default
set -g status-fg colour250
set -g status-left-length 50
set -g status-right-length 150
set -g status-style bg=default,fg=colour250


# Left side: session name
set -g status-left "#[fg=colour34,bold]#S #[fg=colour250]|"

# Right side: user, host, time, date
set -g status-right "#[fg=colour250]#(whoami) | #(hostname -s) | %H:%M %d-%b-%Y #[fg=colour34]"

# Window title format
setw -g window-status-format "#[fg=colour239] #I:#W "
setw -g window-status-current-format "#[fg=colour33,bold]#[bg=default] #I:#W "

# Pane border stylind
# set -g pane-border-style fg=colour238
# set -g pane-active-border-style fg=colour33

# Message and copy mode style
set -g message-style bg=colour33,fg=colour231
set -g mode-style bg=colour33,fg=colour231

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g status-right "%H:%M %d-%b-%Y"
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Keybindings
## Set Prefix
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

## Reload tmux config 
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

## Navigation 
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

## Yanking with vi-style
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

## Split window and keep current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

